apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgelab-hub.fullname" . }}
  labels:
    {{- include "edgelab-hub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.exporter.enabled }}
    - name: metrics
      port: {{ .Values.exporter.port }}
      targetPort: metrics
    {{- end }}
      protocol: TCP
  selector:
    {{- include "edgelab-hub.selectorLabels" . | nindent 4 }}
