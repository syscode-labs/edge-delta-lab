<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Delta — delivery outside Docker</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #f3f1ed; color: #20140f; }
main { max-width: 1280px; margin: auto; }
svg { display: block; width: 100%; height: auto; }
footer { padding: 16px 40px; font: 12px/1.6 'Chakra Petch', Arial, sans-serif; }
a { color: #8f2b16; }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Edge Delta: delivery outside Docker</title>
<desc id="architecture-desc">Registry images pass through a signing publisher and hub, optionally through a removable mTLS proxy, to a receiver that verifies with its pinned public key before loading Docker; only the publisher holds the signing private key, and loading never starts containers.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
text { fill: #20140f; font-family: 'Chakra Petch', Arial, sans-serif; }
.technical { font-family: 'IBM Plex Mono', monospace; }
.muted { fill: #5b3d2f; }
.node-name { font-size: 20px; font-weight: 600; }
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#5b3d2f"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#d3361f"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8f2b16"/></marker>
</defs>
<rect width="1280" height="720" fill="#f3f1ed"/>
<text x="64" y="76" class="technical muted" font-size="12" letter-spacing="2">EDGE DELTA / ARCHITECTURE</text>
<text x="64" y="132" class="technical" font-size="32" font-weight="700">Move the changes. Keep Docker.</text>
<text x="64" y="172" font-size="20" class="muted">Signed releases, reusable chunks, verified local import.</text>

<!-- Zones precede connectors. Private signing authority stops at the publisher. -->
<rect x="240" y="232" width="192" height="232" rx="8" fill="#f3f1ed" stroke="#b6957f" stroke-dasharray="4 4" data-zone="signing"/>
<text x="256" y="260" class="technical muted" font-size="12">SIGNING BOUNDARY</text>
<text x="864" y="260" class="technical muted" font-size="12">VERIFY LOCALLY</text>
<text x="736" y="280" text-anchor="middle" class="technical muted" font-size="12">OPTIONAL</text>

<!-- Content-flow direction, not the direction of HTTP requests. -->
<g fill="none" stroke="#5b3d2f" stroke-width="1.2" marker-end="url(#arrow)">
<line x1="208" y1="352" x2="256" y2="352" data-edge="registry publisher"/>
<line x1="416" y1="352" x2="464" y2="352" data-edge="publisher hub"/>
<line x1="608" y1="352" x2="656" y2="352" data-edge="hub proxy"/>
<line x1="816" y1="352" x2="864" y2="352" data-edge="proxy receiver"/>
<line x1="1024" y1="352" x2="1072" y2="352" data-edge="receiver docker"/>
<path d="M536 404 V480 Q536 488 544 488 H936 Q944 488 944 480 V404" stroke-dasharray="4 4" data-edge="hub receiver"/>
</g>
<!-- Label mask clears its connector by 8px and every node by at least 52px. -->
<rect x="676" y="456" width="120" height="24" fill="#f3f1ed" data-label="bypass"/>
<text x="736" y="472" text-anchor="middle" class="technical muted" font-size="12">EXISTING HTTPS</text>

<g data-node="registry">
<rect x="64" y="300" width="144" height="104" rx="8" fill="#eae5de" stroke="#b6957f"/>
<text x="136" y="344" text-anchor="middle" class="node-name">Registry</text>
<text x="136" y="372" text-anchor="middle" class="muted" font-size="12">Your image source</text>
</g>
<g data-node="publisher">
<rect x="256" y="300" width="160" height="104" rx="8" fill="#f4e0d7" stroke="#d3361f" stroke-width="1.2"/>
<text x="336" y="344" text-anchor="middle" class="node-name">Publisher</text>
<text x="336" y="372" text-anchor="middle" class="muted" font-size="12">Watch · chunk · sign</text>
</g>
<g data-node="hub">
<rect x="464" y="300" width="144" height="104" rx="8" fill="#ffffff" stroke="#20140f"/>
<text x="536" y="344" text-anchor="middle" class="node-name">Hub</text>
<text x="536" y="372" text-anchor="middle" class="muted" font-size="12">Serve signed content</text>
</g>
<g data-node="proxy">
<rect x="656" y="300" width="160" height="104" rx="8" fill="#f3f1ed" stroke="#82604d" stroke-dasharray="4 4"/>
<text x="736" y="344" text-anchor="middle" class="node-name">mTLS proxy</text>
<text x="736" y="372" text-anchor="middle" class="muted" font-size="12">Removable wrapper</text>
</g>
<g data-node="receiver">
<rect x="864" y="300" width="160" height="104" rx="8" fill="#f4e0d7" stroke="#d3361f" stroke-width="1.2"/>
<text x="944" y="344" text-anchor="middle" class="node-name">Receiver</text>
<text x="944" y="372" text-anchor="middle" class="muted" font-size="12">Reuse · verify · rebuild</text>
</g>
<g data-node="docker">
<rect x="1072" y="300" width="144" height="104" rx="8" fill="#eae5de" stroke="#b6957f"/>
<text x="1144" y="344" text-anchor="middle" class="node-name">Docker</text>
<text x="1144" y="372" text-anchor="middle" class="muted" font-size="12">Optional local load</text>
</g>
<text x="336" y="432" text-anchor="middle" class="technical" font-size="12">Private key ONLY</text>
<text x="944" y="284" text-anchor="middle" class="technical" font-size="12">Pinned public key</text>

<text x="64" y="564" font-size="24" font-weight="600">The receiver downloads. Docker never pulls from Edge Delta.</text>
<text x="64" y="600" font-size="16" class="muted">Verify the complete archive before import. Loading does not start or replace containers.</text>
<line x1="64" y1="652" x2="1216" y2="652" stroke="#b6957f" stroke-width="0.8"/>
<text x="64" y="680" class="technical muted" font-size="12">→ CONTENT FLOW</text>
<text x="304" y="680" class="technical muted" font-size="12">DASHED: OPTIONAL / BOUNDARY</text>
<text x="752" y="680" class="muted" font-size="12">HTTPS is required remotely; mTLS does not replace release signatures.</text>
</svg>
<footer>Canonical editable source · Architecture / doc-wide / simplified / engineer + mixed · Light IMP profile.<br>Remote fonts are optional; README image renderers and offline viewers use Arial/monospace fallbacks. Edit this file, then run <code>python3 scripts/diagrams.py</code> from the repository root.</footer>
</main>
</body>
</html>
