<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#486581" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="45" y="69" fill="#172b4d" font-family="Arial,sans-serif" font-size="34"><tspan x="45" dy="0">Interrupted delivery and sender-side observability</tspan></text><text x="45" y="107" fill="#526578" font-family="Arial,sans-serif" font-size="19"><tspan x="45" dy="0">Completion is acknowledged; transmitted bytes alone never imply successful import.</tspan></text><rect x="65" y="165" width="365" height="100" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="83" y="201" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="83" dy="0">Sender origin</tspan></text><text x="83" y="234" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="83" dy="0">Serves immutable chunks</tspan></text><rect x="570" y="165" width="365" height="100" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="588" y="201" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="588" dy="0">Edge agent</tspan></text><text x="588" y="234" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="588" dy="0">Keeps verified local cache</tspan></text><rect x="1120" y="165" width="365" height="100" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="1138" y="201" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="1138" dy="0">Docker</tspan></text><text x="1138" y="234" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1138" dy="0">Not involved in WAN transfer</tspan></text><polyline points="430,325 570,325" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="175" y="302" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="175" dy="0">Chunk A completes</tspan></text><text x="595" y="364" fill="#2b7052" font-family="Arial,sans-serif" font-size="18"><tspan x="595" dy="0">Verify + durable commit A</tspan></text><polyline points="430,430 535,430" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="175" y="408" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="175" dy="0">Chunk B is cut off</tspan></text><text x="540" y="440" fill="#ad342e" font-family="Arial,sans-serif" font-size="32"><tspan x="540" dy="0">X</tspan></text><text x="595" y="450" fill="#243b53" font-family="Arial,sans-serif" font-size="18"><tspan x="595" dy="0">Discard partial B; keep A</tspan></text><polyline points="570,510 430,510" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="120" y="486" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="120" dy="0">Reconnect / retry B only</tspan></text><polyline points="430,595 570,595" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="220" y="573" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="220" dy="0">Complete B</tspan></text><text x="595" y="633" fill="#2b7052" font-family="Arial,sans-serif" font-size="18"><tspan x="595" dy="0">Verify + commit B; assemble</tspan><tspan x="595" dy="23.400000000000002">Verify complete archive</tspan></text><polyline points="935,715 1120,715" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="940" y="690" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="940" dy="0">Local docker load</tspan></text><polyline points="1120,790 935,790" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="940" y="766" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="940" dy="0">Import succeeds</tspan></text><polyline points="570,870 430,870" fill="none" stroke="#486581" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="90" y="845" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="90" dy="0">POST loaded acknowledgement</tspan></text><text x="600" y="876" fill="#243b53" font-family="Arial,sans-serif" font-size="18"><tspan x="600" dy="0">Ack fails? Persist it; retry later.</tspan><tspan x="600" dy="23.400000000000002">Duplicate ack is idempotent.</tspan></text><rect x="65" y="942" width="1420" height="95" rx="12" fill="#fff8e6" stroke="#876925" stroke-width="2"/><text x="83" y="978" fill="#876925" font-family="Arial,sans-serif" font-size="21"><tspan x="83" dy="0">Operator CLI reads the sender collector</tspan></text><text x="83" y="1011" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="83" dy="0">Bytes served = observed. Staged / loaded = device acknowledgement. Running / healthy requires a separate probe.</tspan></text></svg>