<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="960" viewBox="0 0 1560 960"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#486581" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="45" y="69" fill="#172b4d" font-family="Arial,sans-serif" font-size="34"><tspan x="45" dy="0">Why a small image edit becomes a small transfer</tspan></text><text x="45" y="107" fill="#526578" font-family="Arial,sans-serif" font-size="19"><tspan x="45" dy="0">Content-defined chunks are identified BEFORE compression; each chunk is compressed independently.</tspan></text><rect x="50" y="160" width="1450" height="115" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="68" y="196" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="68" dy="0">Existing image v1</tspan></text><text x="68" y="229" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="68" dy="0">One large uncompressed layer, not a newly added tiny layer. The device already has the verified chunks.</tspan></text><rect x="100" y="320" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="118" y="360" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="118" dy="0">A</tspan></text><text x="118" y="389" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="118" dy="0">cached</tspan></text><rect x="320" y="320" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="338" y="360" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="338" dy="0">B</tspan></text><text x="338" y="389" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="338" dy="0">cached</tspan></text><rect x="540" y="320" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="558" y="360" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="558" dy="0">C</tspan></text><text x="558" y="389" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="558" dy="0">cached</tspan></text><rect x="760" y="320" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="778" y="360" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="778" dy="0">D</tspan></text><text x="778" y="389" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="778" dy="0">cached</tspan></text><rect x="980" y="320" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="998" y="360" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="998" dy="0">E</tspan></text><text x="998" y="389" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="998" dy="0">cached</tspan></text><rect x="1200" y="320" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="1218" y="360" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="1218" dy="0">F</tspan></text><text x="1218" y="389" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1218" dy="0">cached</tspan></text><text x="55" y="459" fill="#243b53" font-family="Arial,sans-serif" font-size="22"><tspan x="55" dy="0">Change 32 KiB inside the large file; rebuild image v2.</tspan></text><rect x="100" y="510" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="118" y="550" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="118" dy="0">A</tspan></text><text x="118" y="579" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="118" dy="0">reuse</tspan></text><rect x="320" y="510" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="338" y="550" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="338" dy="0">B</tspan></text><text x="338" y="579" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="338" dy="0">reuse</tspan></text><rect x="540" y="510" width="180" height="85" rx="12" fill="#fff0dc" stroke="#945817" stroke-width="2"/><text x="558" y="550" fill="#945817" font-family="Arial,sans-serif" font-size="25"><tspan x="558" dy="0">X</tspan></text><text x="558" y="579" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="558" dy="0">fetch</tspan></text><rect x="760" y="510" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="778" y="550" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="778" dy="0">D</tspan></text><text x="778" y="579" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="778" dy="0">reuse</tspan></text><rect x="980" y="510" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="998" y="550" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="998" dy="0">E</tspan></text><text x="998" y="579" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="998" dy="0">reuse</tspan></text><rect x="1200" y="510" width="180" height="85" rx="12" fill="#e7f5ee" stroke="#2b7052" stroke-width="2"/><text x="1218" y="550" fill="#2b7052" font-family="Arial,sans-serif" font-size="25"><tspan x="1218" dy="0">F</tspan></text><text x="1218" y="579" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1218" dy="0">reuse</tspan></text><polyline points="630,595 630,680 965,680" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="280" y="654" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="280" dy="0">Only missing chunk objects + signed manifest</tspan></text><rect x="995" y="640" width="485" height="110" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="1013" y="676" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="1013" dy="0">Reconstruct exact target archive</tspan></text><text x="1013" y="709" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1013" dy="0">All chunks in manifest order</tspan><tspan x="1013" dy="22.1">Verify whole-archive SHA-256</tspan></text><rect x="55" y="785" width="1425" height="125" rx="12" fill="#fff8e6" stroke="#876925" stroke-width="2"/><text x="73" y="821" fill="#876925" font-family="Arial,sans-serif" font-size="21"><tspan x="73" dy="0">What a changed hash means</tspan></text><text x="73" y="854" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="73" dy="0">A new layer digest does not make all bytes new. Chunk hashes expose reusable content inside that layer.</tspan><tspan x="73" dy="22.1">This is an independent lab CDC format, not native Docker registry delta support.</tspan><tspan x="73" dy="22.1">Compression, tar metadata and chunk-boundary effects are measured rather than assumed.</tspan></text></svg>