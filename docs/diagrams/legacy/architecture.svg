<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1030" viewBox="0 0 1560 1030"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#486581" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="45" y="69" fill="#172b4d" font-family="Arial,sans-serif" font-size="34"><tspan x="45" dy="0">Docker delta delivery: architecture</tspan></text><text x="45" y="107" fill="#526578" font-family="Arial,sans-serif" font-size="19"><tspan x="45" dy="0">Image transport stays outside Docker. Operator visibility stays on the sender.</tspan></text><text x="55" y="168" fill="#486581" font-family="Arial,sans-serif" font-size="18"><tspan x="55" dy="0">SENDER / YOUR INFRASTRUCTURE</tspan></text><text x="1130" y="168" fill="#486581" font-family="Arial,sans-serif" font-size="18"><tspan x="1130" dy="0">EDGE / CUSTOMER DEVICE</tspan></text><rect x="55" y="210" width="255" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="73" y="246" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="73" dy="0">Docker build + save</tspan></text><text x="73" y="279" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="73" dy="0">Actual images and layers</tspan><tspan x="73" dy="22.1">Exact image/config IDs</tspan></text><rect x="370" y="210" width="315" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="388" y="246" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="388" dy="0">Release publisher</tspan></text><text x="388" y="279" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="388" dy="0">Normalize layer compression</tspan><tspan x="388" dy="22.1">Chunk raw bytes; gzip chunks</tspan><tspan x="388" dy="22.1">Sign the ordered recipe</tspan></text><rect x="755" y="210" width="300" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="773" y="246" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="773" dy="0">HTTP origin</tspan></text><text x="773" y="279" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="773" dy="0">Immutable chunk objects</tspan><tspan x="773" dy="22.1">Signed release manifests</tspan></text><rect x="1130" y="210" width="360" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="1148" y="246" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="1148" dy="0">Edge agent</tspan></text><text x="1148" y="279" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1148" dy="0">Pull missing chunks only</tspan><tspan x="1148" dy="22.1">Retry on intermittent WAN</tspan></text><polyline points="310,270 370,270" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="685,270 755,270" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1055,250 1130,250" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1057" y="225" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="1057" dy="0">5 Mbit/s</tspan></text><polyline points="1290,330 1290,380 905,380 905,330" fill="none" stroke="#486581" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="770" y="409" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="770" dy="0">Outbound durable acknowledgement (staged / loaded)</tspan></text><rect x="1130" y="465" width="360" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="1148" y="501" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="1148" dy="0">Verified chunk cache</tspan></text><text x="1148" y="534" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1148" dy="0">SHA-256; file sync; rename</tspan><tspan x="1148" dy="22.1">Directory sync; keep progress</tspan></text><polyline points="1310,330 1510,330 1510,525 1490,525" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1130" y="650" width="360" height="110" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="1148" y="686" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="1148" dy="0">Local reconstruction</tspan></text><text x="1148" y="719" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1148" dy="0">Complete archive + SHA-256</tspan><tspan x="1148" dy="22.1">No Docker action before this</tspan></text><polyline points="1310,585 1310,650" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1130" y="840" width="360" height="105" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="1148" y="876" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="1148" dy="0">Existing Docker daemon</tspan></text><text x="1148" y="909" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="1148" dy="0">docker load; offline test run</tspan><tspan x="1148" dy="22.1">No runtime replacement</tspan></text><polyline points="1310,760 1310,840" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="755" y="465" width="300" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="773" y="501" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="773" dy="0">Sender collector</tspan></text><text x="773" y="534" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="773" dy="0">Poll /stats and /receipts</tspan><tspan x="773" dy="22.1">Keep SQLite history</tspan></text><polyline points="850,330 720,330 720,440 905,440 905,465" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><text x="748" y="363" fill="#486581" font-family="Arial,sans-serif" font-size="16"><tspan x="748" dy="0">Sender endpoints</tspan></text><rect x="370" y="465" width="315" height="120" rx="12" fill="#eaf2f8" stroke="#476582" stroke-width="2"/><text x="388" y="501" fill="#476582" font-family="Arial,sans-serif" font-size="21"><tspan x="388" dy="0">Operator CLI</tspan></text><text x="388" y="534" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="388" dy="0">Live view; JSON; CSV</tspan><tspan x="388" dy="22.1">No SSH into the edge</tspan></text><polyline points="755,525 685,525" fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="670" width="1000" height="145" rx="12" fill="#fff8e6" stroke="#876925" stroke-width="2"/><text x="73" y="706" fill="#876925" font-family="Arial,sans-serif" font-size="21"><tspan x="73" dy="0">Two kinds of evidence</tspan></text><text x="73" y="739" fill="#334e68" font-family="Arial,sans-serif" font-size="17"><tspan x="73" dy="0">Observed: response-body bytes, requests, injected failures.</tspan><tspan x="73" dy="22.1">Acknowledged: device says the exact archive was staged or Docker loaded it.</tspan><tspan x="73" dy="22.1">Neither bytes served nor LOADED proves application health.</tspan></text><text x="55" y="884" fill="#243b53" font-family="Arial,sans-serif" font-size="19"><tspan x="55" dy="0">Demo: real Docker images + 32 KiB edit inside a large layer.</tspan><tspan x="55" dy="24.7">Collector runs centrally. The edge exposes no inbound metrics port.</tspan><tspan x="55" dy="24.7">Acknowledgement and collector control traffic are outside the chunk-byte counters.</tspan></text></svg>